name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_ONLY: functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only "$DEPLOY_ONLY" --project calendar-ae3ff --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
