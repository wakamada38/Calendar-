<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Calendar</title>
<script src="firebase-config.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f7a52"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2b24;--mut:#6b7a72;--ac:#1f7a52;--acs:#e0f1e8;--bd:#e3e1d9;--red:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mut:#93a49a;--ac:#4cc38a;--acs:#21392d;--bd:#2c3a32;--red:#ef7a6d}}
:root[data-theme=dark]{--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mut:#93a49a;--ac:#4cc38a;--acs:#21392d;--bd:#2c3a32;--red:#ef7a6d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:12px 12px 80px}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
textarea{min-height:170px;resize:vertical}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h1{flex:1;font-size:19px;margin:0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.cell{aspect-ratio:1/1.05;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.cell.o{opacity:.4}.cell.t .n{background:var(--ac);color:#fff}.cell.s{outline:2px solid var(--ac)}
.n{font-size:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.sheet{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.sheet h2{margin:0 0 8px;font-size:17px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px}
.tabs button{flex:1;white-space:nowrap;padding:7px 8px;font-size:13px}
.tabs button.a{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.row{display:flex;gap:6px;margin-bottom:6px}.row>*{min-width:0}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-top:6px}
.item .b{flex:1;min-width:0;overflow-wrap:anywhere}.item small{color:var(--mut);display:block}
.item.d .b{text-decoration:line-through;opacity:.55}
.x{background:none;border:none;color:var(--red);padding:4px 8px;font-size:18px}
.sw{width:14px;height:14px;border-radius:50%;flex:none}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.imgs div{position:relative}.imgs .x{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;padding:0 7px}
audio{width:100%;margin-top:4px}
.rec{background:var(--red);color:#fff;border-color:var(--red)}
.mut{color:var(--mut);font-size:13px}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:616px;margin:auto;background:var(--ac);color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;box-shadow:0 4px 18px #0005}
#view{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:8}#view img{max-width:96%;max-height:92%}
select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 6px;color:inherit;font:inherit}.top h1{font-size:17px}.top button{padding:8px 9px}.mo{flex:1;padding:6px 0;font-size:18px}.mo.a{background:var(--acs);border-color:var(--ac)}#off{display:none;text-align:center;font-size:12px;color:var(--mut);margin:-4px 0 8px}#mt{cursor:pointer}.sw.nc{width:28px;height:28px;cursor:pointer}.nc.on{outline:2px solid var(--tx);outline-offset:2px}#ncp{width:36px;height:30px;padding:0;border:none;background:none;margin-left:auto}#nt{min-height:170px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;overflow-wrap:anywhere;outline:none;white-space:pre-wrap}#nt:empty:before{content:attr(data-ph);color:var(--mut)}#nt:focus{border-color:var(--ac)}#tb button{flex:none;min-width:40px}#tb select{flex:1}.n.h{color:#d93025;font-weight:600}.hn{font-size:9px;line-height:1.15;color:#d93025;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.hn.o{color:var(--mut)}.cell{overflow:hidden}.up{margin-top:14px}.up h3{font-size:14px;margin:0 0 4px;color:var(--mut)}
</style></head><body>
<div id="toast"></div><div id="view"><img alt=""></div>
<div class="top"><button id="pv">‹</button><h1 id="mt"></h1><button id="nx">›</button><button id="td">Today</button><button id="sb">🔍</button><button id="mn">⋮</button></div><div class="sheet" id="pn" style="display:none;margin:0 0 10px"></div>
<div class="sheet" id="bkn" style="display:none;margin:0 0 10px"></div><div id="off">Offline · everything is saved on this device</div><div class="grid" id="g"></div>
<div class="sheet" id="sh"></div>
<div class="up"><h3>Upcoming reminders</h3><div id="upl"></div><h3 style="margin-top:12px">Upcoming holidays</h3><div id="uph"></div></div>
<script>
const $=s=>document.querySelector(s);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const COL=['#1f7a52','#2a6fdb','#d9822b','#c0392b','#8e44ad','#16a2b8'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let D={},db=null,cur=new Date(),sel=key(new Date()),tab='notes',urls=[];
cur.setDate(1);
/* storage */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('mycal',2);q.onupgradeneeded=()=>{const x=q.result;if(!x.objectStoreNames.contains('days'))x.createObjectStore('days');if(!x.objectStoreNames.contains('bk'))x.createObjectStore('bk')};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function loadAll(){return new Promise(r=>{if(!db)return r();const o=db.transaction('days').objectStore('days'),c=o.openCursor();c.onsuccess=()=>{const x=c.result;if(x){D[x.key]=x.value;x.continue()}else r()};c.onerror=()=>r()})}
function save(k,raw){if(!raw&&D[k])D[k].u=Date.now();try{if(db)db.transaction('days','readwrite').objectStore('days').put(D[k],k)}catch(e){}if(!raw)syncSoon()}
const day=k=>D[k]||(D[k]={notes:'',events:[],rem:[],recs:[],imgs:[]});
function parse(k){const p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setFullYear(+p[0]);return d}
function eventsOn(k){const out=[],t=parse(k);
 for(const o in D)for(const e of D[o].events){
  if(o==k){out.push({...e,o});continue}
  if(!e.rep||e.rep=='none'||o>k)continue;const s=parse(o);let m=false;
  if(e.rep=='daily')m=true;else if(e.rep=='weekly')m=s.getDay()==t.getDay();else if(e.rep=='monthly')m=s.getDate()==t.getDate();else if(e.rep=='yearly')m=s.getDate()==t.getDate()&&s.getMonth()==t.getMonth();
  if(m)out.push({...e,o})}
 return out}
function has(k){const d=D[k];return {n:!!(d&&d.notes&&d.notes.trim()),r:d?d.rem.length:0,v:d?d.recs.length:0,i:d?d.imgs.length:0,ev:eventsOn(k).concat(gOn(k)),h:hOn(k),m:d&&d.mood}}
/* calendar */
function renderCal(){
 $('#mt').textContent=MN[cur.getMonth()]+' '+cur.getFullYear()+' ▾';
 let h=['S','M','T','W','T','F','S'].map(x=>`<div class="dow">${x}</div>`).join('');
 const st=new Date(cur);st.setDate(1-cur.getDay());const tk=key(new Date());
 for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=key(d),x=has(k);
  let dots='';(x.ev||[]).slice(0,3).forEach(e=>dots+=`<i style="background:${e.color}"></i>`);
  if(x.h&&x.h.some(z=>z.t=='p'))dots='<i style="background:#d93025"></i>'+dots;if(x.r)dots+='<i style="background:#d9822b"></i>';if(x.n)dots+='<i style="background:var(--mut)"></i>';if(x.v)dots+='<i style="background:#8e44ad"></i>';if(x.i)dots+='<i style="background:#2a6fdb"></i>';
  h+=`<div class="cell${d.getMonth()!=cur.getMonth()?' o':''}${k==tk?' t':''}${k==sel?' s':''}" data-k="${k}"><span class="n${x.h&&x.h.length&&x.h[0].t=='p'?' h':''}">${d.getDate()}</span>${x.h&&x.h.length?`<span class="hn${x.h[0].t=='o'?' o':''}">${esc(x.h[0].n)}</span>`:''}<div class="dots">${dots}</div>${x.m?'<span style="font-size:11px;line-height:1">'+x.m+'</span>':''}</div>`}
 $('#g').innerHTML=h;
 document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{sel=c.dataset.k;const p=sel.split('-');if(+p[1]-1!=cur.getMonth()){cur=new Date(+p[0],+p[1]-1,1)}renderCal();renderSheet()});
 renderUp()}
function renderUp(){
 const now=Date.now(),L=[];
 for(const k in D)D[k].rem.forEach(r=>{if(r.done)return;const t=new Date(k+'T'+(r.time||'09:00')).getTime();if(t>=now-864e5)L.push({k,r,t})});
 L.sort((a,b)=>a.t-b.t);
 $('#upl').innerHTML=L.slice(0,6).map(x=>`<div class="item"><div class="b">${esc(x.r.title)}<small>${x.k} · ${x.r.time}</small></div></div>`).join('')||'<div class="mut">Nothing pending.</div>';renderHol()}
/* day sheet */
function fmt(k){const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function renderSheet(){nsel=null;
 urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
 const d=day(sel),L=isLocked(sel),T=[['notes','Notes'],['events','Events'],['rem','Reminders'],['recs','Voice'],['imgs','Photos']];
 const X=(t,id,o)=>L||(o&&isLocked(o))?'<span title="Locked">🔒</span>':`<button class="x" data-del="${t}"${o?` data-o="${o}"`:''} data-id="${id}">×</button>`;
 let h=`<div class="row" style="align-items:center"><h2 style="flex:1;margin:0">${fmt(sel)}</h2><button id="lk">${L?'🔒 Locked':'🔓 Lock day'}</button></div>${hOn(sel).map(z=>`<div style="margin:2px 0 8px;font-size:13px;color:${z.t=='p'?'#d93025':'var(--mut)'}">${z.t=='p'?'🎉':'✨'} ${esc(z.n)}</div>`).join('')}<div class="tabs" style="margin-top:8px">${T.map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?'a':''}">${t[1]}${t[0]!='notes'&&d[t[0]].length?' ('+d[t[0]].length+')':''}</button>`).join('')}</div>`;
 if(L)h+='<div class="mut" style="margin-bottom:8px">This day is locked. Tap 🔒 Locked to unlock it before editing or deleting.</div>';
 if(tab=='notes')h+=`<div class="row">${['😀','🙂','😐','🙁','😢','😡','😴'].map(m=>`<button class="mo${d.mood==m?' a':''}" data-m="${m}"${L?' disabled':''}>${m}</button>`).join('')}</div>${L?'':`<div class="row" id="tb"><button data-f="bold"><b>B</b></button><button data-f="italic"><i>I</i></button><button data-f="underline"><u>U</u></button><select id="nf"><option value="">Font</option>${FONTS.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join('')}</select><select id="ns"><option value="">Size</option>${SIZES.map((z,i)=>`<option value="${i}">${z}</option>`).join('')}</select></div><div class="row" style="align-items:center;margin-bottom:6px">${NCOL.map(c=>`<span class="sw nc${(d.nc||'')==c?' on':''}" data-nc="${c}" title="${c?'Text colour':'Default colour / clear formatting'}" style="background:${c||'var(--tx)'}"></span>`).join('')}<input type="color" id="ncp" value="${d.nc||'#1d2b24'}"></div><div class="mut" style="margin-bottom:6px">Select words to change just them. With nothing selected, changes apply to the whole note.</div>`}<div id="nt" data-ph="Write about your day…" contenteditable="${L?'false':'true'}" style="${d.nc?'color:'+esc(d.nc)+';':''}${d.nf?'font-family:'+esc(d.nf)+';':''}${d.nz?'font-size:'+(+d.nz)+'px;':''}">${noteHtml(d)}</div>`;
 if(tab=='events'){if(!L)h+=`<div class="row"><input id="et" placeholder="Event title"></div><div class="row"><input id="es" type="time"><input id="ee" type="time"></div><div class="row"><input id="el" placeholder="Location (optional)"></div><div class="row"><select id="er"><option value="none">Doesn’t repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select><select id="ea2"><option value="0">No alert</option><option value="10">10 min before</option><option value="30">30 min before</option><option value="60">1 hour before</option></select></div><div class="row" id="cp">${COL.map((c,i)=>`<span class="sw" data-c="${c}" style="background:${c};${i==0?'outline:2px solid var(--tx)':''}"></span>`).join('')}<button class="p" id="ea" style="margin-left:auto">Add</button></div>`;
  h+=eventsOn(sel).sort((a,b)=>(a.s||'').localeCompare(b.s||'')).map(e=>`<div class="item"><span class="sw" style="background:${e.color}"></span><div class="b">${esc(e.title)}<small>${e.s?e.s+(e.e?' – '+e.e:''):'All day'}${e.l?' · 📍 '+esc(e.l):''}${e.rep&&e.rep!='none'?' · 🔁 '+e.rep:''}${e.al?' · 🔔 '+e.al+'m':''}</small></div>${X('events',e.id,e.o)}</div>`).join('')+gOn(sel).map(g=>`<div class="item"><span class="sw" style="background:${g.color}"></span><div class="b">${g.task?(g.done?'☑ ':'☐ '):''}${esc(g.title)}<small>${g.time?g.time+(g.end?' – '+g.end:''):'All day'} · ${esc(g.acc)}${g.task?' · Tasks':''}</small></div><span class="mut">Google</span></div>`).join('')}
 if(tab=='rem'){if(!L)h+=`<div class="row"><input id="rt" placeholder="Remind me to…"><input id="rm" type="time" style="width:120px" value="09:00"></div><div class="row"><button class="p" id="ra" style="width:100%">Add reminder</button></div>`;
  h+=d.rem.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(r=>`<div class="item${r.done?' d':''}"><input type="checkbox" style="width:auto" data-chk="${r.id}" ${r.done?'checked':''}${L?' disabled':''}><div class="b">${esc(r.title)}<small>${r.time}</small></div>${X('rem',r.id)}</div>`).join('')}
 if(tab=='recs'){if(!L)h+=`<div class="row"><button class="rec" id="rb" style="flex:1">● Record</button><button id="ru">Upload audio</button><input type="file" id="rf" accept="audio/*" hidden></div><div class="mut" id="rs"></div>`;
  d.recs.forEach(r=>{if(!r.blob){h+='<div class="item mut">⏳ Downloading recording…</div>';return}const u=URL.createObjectURL(r.blob);urls.push(u);h+=`<div class="item" style="display:block"><div style="display:flex;align-items:center"><div class="b">${esc(r.name)}<small>${r.at}</small></div>${X('recs',r.id)}</div><audio controls src="${u}"></audio></div>`})}
 if(tab=='imgs'){if(!L)h+=`<div class="row"><button class="p" id="ib" style="width:100%">+ Add photos</button><input type="file" id="if" accept="image/*" multiple hidden></div>`;h+='<div class="imgs">';
  d.imgs.forEach(r=>{if(!r.blob){h+='<div class="mut">⏳</div>';return}const u=URL.createObjectURL(r.blob);urls.push(u);h+=`<div><img src="${u}" alt="">${L?'':X('imgs',r.id)}</div>`});h+='</div>'}
 $('#sh').innerHTML=h;wire()}
function wire(){
 const d=day(sel);
 if($('#lk'))$('#lk').onclick=toggleLock;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(rec)return;tab=b.dataset.t;renderSheet()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this?'))return;const o=b.dataset.o||sel;if(isLocked(o))return toast('This day is locked');const dd=day(o);dd[b.dataset.del]=dd[b.dataset.del].filter(x=>x.id!=b.dataset.id);(dd.del=dd.del||[]).push(b.dataset.id);save(o);renderSheet();renderCal()});
 document.querySelectorAll('[data-chk]').forEach(b=>b.onchange=()=>{const r=d.rem.find(x=>x.id==b.dataset.chk);r.done=b.checked;save(sel);renderSheet();renderUp()});
 if($('#nt')){$('#nt').oninput=noteSave;$('#nt').onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))}}
 document.querySelectorAll('[data-f]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>fx(b.dataset.f)});
 const part=()=>nsel&&!nsel.collapsed;
 document.querySelectorAll('[data-nc]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{if(isLocked(sel))return;const c=b.dataset.nc;if(part()){c?fx('foreColor',c):fx('removeFormat')}else{d.nc=c;save(sel);renderSheet()}}});
 if($('#nf'))$('#nf').onchange=e=>{const v=e.target.value;if(v==='')return;const f=FONTS[+v][1];if(part())fx('fontName',f);else{d.nf=+v==0?'':f;save(sel);renderSheet()}};
 if($('#ns'))$('#ns').onchange=e=>{const v=e.target.value;if(v==='')return;if(part())fx('fontSize',SZCMD[+v]);else{d.nz=+v==1?0:SZPX[+v];save(sel);renderSheet()}};
 if($('#ncp'))$('#ncp').onchange=e=>{if(isLocked(sel))return;if(part())fx('foreColor',e.target.value);else{d.nc=e.target.value;save(sel);renderSheet()}}
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{d.mood=d.mood==b.dataset.m?'':b.dataset.m;save(sel);renderSheet();renderCal()});
 if($('#ea')){let col=COL[0];document.querySelectorAll('.sw[data-c]').forEach(s=>s.onclick=()=>{col=s.dataset.c;document.querySelectorAll('.sw[data-c]').forEach(x=>x.style.outline='');s.style.outline='2px solid var(--tx)'});
  $('#ea').onclick=()=>{const t=$('#et').value.trim();if(!t)return;d.events.push({id:uid(),title:t,s:$('#es').value,e:$('#ee').value,l:$('#el').value.trim(),rep:$('#er').value,al:+$('#ea2').value,color:col});askNotif();save(sel);renderSheet();renderCal()}}
 if($('#ra'))$('#ra').onclick=()=>{const t=$('#rt').value.trim();if(!t)return;d.rem.push({id:uid(),title:t,time:$('#rm').value||'09:00',done:false,fired:false});save(sel);
  try{if('Notification'in window&&Notification.permission=='default')Notification.requestPermission()}catch(e){}renderSheet();renderCal()};
 if($('#rb')){$('#rb').onclick=toggleRec;$('#ru').onclick=()=>$('#rf').click();$('#rf').onchange=e=>{[...e.target.files].forEach(f=>addRec(f,f.name))}}
 if($('#ib')){$('#ib').onclick=()=>$('#if').click();$('#if').onchange=async e=>{for(const f of e.target.files){d.imgs.push({id:uid(),blob:await shrink(f)})}save(sel);renderSheet();renderCal()}}
 document.querySelectorAll('.imgs img').forEach(i=>i.onclick=()=>{$('#view img').src=i.src;$('#view').style.display='grid'})}
function shrink(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);r(b||f)},'image/jpeg',.82)};im.onerror=()=>r(f);im.src=u})}
/* recording */
let rec=null,chunks=[],tm=null,t0=0;
async function toggleRec(){
 if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{clearInterval(tm);st.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;addRec(b,'Recording '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))};
  rec.start();t0=Date.now();$('#rb').textContent='■ Stop';

const FONTS=[['System','system-ui,sans-serif'],['Serif',"Georgia,'Times New Roman',serif"],['Typewriter',"'Courier New',monospace"],['Handwritten',"'Comic Sans MS','Segoe Print',cursive"],['Display',"Impact,'Arial Black',sans-serif"]],SIZES=['Small','Normal','Large','Big','Huge'],SZPX=[13,15,18,22,28],SZCMD=[2,3,4,5,6];

function clean(html){const t=document.createElement('template');t.innerHTML=html||'';

  if(c.nodeType!=1||!OKT.has(c.tagName)){c.replaceWith(document.createTextNode(c.nodeType==1?c.textContent:''));return}
  const st=(c.getAttribute('style')||'').split(';').map(x=>x.trim()).filter(x=>OKS.includes(x.split(':')[0].trim().toLowerCase())&&!/url\(|expression|javascript|@import/i.test(x)).join(';');
  [...c.attributes].forEach(a=>c.removeAttribute(a.name));if(st)c.setAttribute('style',st);w(c)})})(t.content);
 return t.innerHTML}

/* automatic backups: daily snapshots (text) + weekly reminder to save a file */
const hasAny=()=>Object.values(D).some(d=>(d.notes&&d.notes.trim())||d.events.length||d.rem.length||d.recs.length||d.imgs.length||d.mood);
function bkAll(){return new Promise(r=>{try{if(!db)return r([]);const o=[],c=db.transaction('bk').objectStore('bk').openCursor();c.onsuccess=()=>{const x=c.result;if(x){o.push({k:x.key,v:x.value});x.continue()}else r(o)};c.onerror=()=>r([])}catch(e){r([])}})}
function bkPut(k,v){return new Promise(r=>{try{if(!db)return r();const t=db.transaction('bk','readwrite');t.objectStore('bk').put(v,k);t.oncomplete=r;t.onerror=r}catch(e){r()}})}
function bkDel(k){return new Promise(r=>{try{const t=db.transaction('bk','readwrite');t.objectStore('bk').delete(k);t.oncomplete=r;t.onerror=r}catch(e){r()}})}
function snapData(){const o={};for(const k in D){const d=D[k];if(!((d.notes&&d.notes.trim())||d.events.length||d.rem.length||d.recs.length||d.imgs.length||d.mood))continue;o[k]={...d,recs:d.recs.map(({blob,...r})=>r),imgs:d.imgs.map(({blob,...r})=>r)}}return o}
async function autoSnap(){if(localStorage.getItem('autobk')=='0'||!db||!hasAny())return;
 await bkPut('d'+key(new Date()),{at:Date.now(),days:snapData()});
 const all=(await bkAll()).filter(x=>x.k[0]=='d').sort((a,b)=>b.k.localeCompare(a.k));for(const x of all.slice(14))await bkDel(x.k)}
async function autoBoot(){if(localStorage.getItem('autobk')=='0'||!db)return;if(!(await bkAll()).some(x=>x.k=='d'+key(new Date())))await autoSnap()}

function nudge(){const e=$('#bkn'),lf=+localStorage.getItem('lastfile')||0,sn=+localStorage.getItem('bksnooze')||0;
 if(!(localStorage.getItem('bknudge')!='0'&&hasAny()&&Date.now()-lf>7*864e5&&Date.now()>sn)){e.style.display='none';return}
 e.style.display='block';e.innerHTML=`<div>💾 ${lf?'It has been '+Math.floor((Date.now()-lf)/864e5)+' days since your last backup file.':'You have not saved a backup file yet.'}</div><div class="row" style="margin-top:8px"><button class="p" id="nb" style="flex:1">Back up now</button><button id="nl" style="flex:1">Later</button></div>`;
 $('#nb').onclick=()=>exportAll();$('#nl').onclick=()=>{localStorage.setItem('bksnooze',Date.now()+2*864e5);nudge()}}
async function bkRestore(k){const s=(await bkAll()).find(x=>x.k==k);if(!s)return;
 if(!await askPin('Restore notes, events and reminders from this backup? Locked days are left unchanged.'))return;
 await bkPut('undo',{at:Date.now(),days:snapData()});let n=0,sk=0;
 for(const d in s.v.days){const r=s.v.days[d];if(isLocked(d)){sk++;continue}const c=day(d);
  const keep=t=>(r[t]||[]).map(x=>{const cur=(c[t]||[]).find(y=>y.id==x.id);return cur&&cur.blob?cur:(x.p?x:null)}).filter(Boolean);
  const rs=keep('recs'),im=keep('imgs'),ids=[...(r.events||[]),...(r.rem||[]),...rs,...im].map(x=>x.id);
  Object.assign(c,r,{recs:rs,imgs:im,del:(c.del||[]).filter(i=>!ids.includes(i))});save(d);n++}
 renderCal();renderSheet();toast('Restored '+n+' day'+(n==1?'':'s')+(sk?', skipped '+sk+' locked':''));openBackup()}
async function openBackup(){const on=localStorage.getItem('autobk')!='0',wk=localStorage.getItem('bknudge')!='0',lf=+localStorage.getItem('lastfile')||0;

 pn.innerHTML=`<label class="item"><input type="checkbox" id="ba" style="width:auto" ${on?'checked':''}> Automatic daily backups (keeps 14 days)</label><label class="item"><input type="checkbox" id="bw" style="width:auto" ${wk?'checked':''}> Remind me weekly to save a backup file</label><div class="mut" style="margin:6px 0">Last backup file: ${lf?new Date(lf).toLocaleDateString():'never'}</div><div class="row"><button class="p" id="bn" style="flex:1">Save backup file now</button><button id="bx">✕</button></div><div style="margin-top:10px"><b>Automatic backups</b></div>`+
 (list.length?list.map(x=>`<div class="item"><div class="b">${x.k=='undo'?'Before last restore':new Date(x.k.slice(1)+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}<small>${Object.keys(x.v.days).length} days with entries</small></div><button data-br="${x.k}">Restore</button></div>`).join(''):'<div class="mut">None yet. The first one is saved when you leave the app.</div>')+
 `<div class="mut" style="margin-top:6px">These keep text only: notes, events, reminders and moods. Photos and recordings are protected by the backup file and by online sync.</div>`;

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function nthDow(y,m,w,n){const f=new Date(y,m,1);return new Date(y,m,1+(w-f.getDay()+7)%7+(n-1)*7)}
function hijri(y){const o={};try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric'});
 for(let i=0;i<=366;i++){const d=new Date(y,0,1+i);if(d.getFullYear()!=y)break;const p=f.formatToParts(d),dd=+p.find(x=>x.type=='day').value,mm=+p.find(x=>x.type=='month').value;if(!o[mm+'-'+dd])o[mm+'-'+dd]=d}}catch(e){}return o}
const HY={},HX={};
function holYear(y){if(HY[y])return HY[y];const L=[],pub=new Set(),add=(dt,n,t)=>{L.push({d:key(dt),n,t});if(t=='p')pub.add(key(dt))};
 const E=easter(y),off=n=>{const x=new Date(E);x.setDate(x.getDate()+n);return x},H=hijri(y);
 const fixed=[[1,1,"New Year's Day"],[5,1,'Labour Day'],[6,1,'Madaraka Day'],[10,10,y>=2024?'Mazingira Day':'Moi / Huduma Day (now Mazingira Day)'],[10,20,'Mashujaa Day'],[12,12,'Jamhuri Day'],[12,25,'Christmas Day'],[12,26,'Boxing Day / Utamaduni Day']];
 fixed.forEach(f=>add(new Date(y,f[0]-1,f[1]),f[2],'p'));
 add(off(-2),'Good Friday','p');add(off(1),'Easter Monday','p');
 if(H['10-1'])add(H['10-1'],'Idd-ul-Fitr (approx.)','p');if(H['12-10'])add(H['12-10'],'Idd-ul-Azha (approx.)','p');
 fixed.forEach(f=>{const dt=new Date(y,f[0]-1,f[1]);if(dt.getDay()==0){const m=new Date(dt);do{m.setDate(m.getDate()+1)}while(pub.has(key(m)));add(m,f[2]+' (observed)','p')}});
 [[2,14,"Valentine's Day"],[3,8,"International Women's Day"],[3,21,'International Day of Forests'],[4,22,'Earth Day'],[5,25,'Africa Day'],[6,5,'World Environment Day'],[8,15,'Assumption of Mary'],[10,5,"World Teachers' Day"],[11,1,'All Saints’ Day'],[12,24,'Christmas Eve'],[12,31,"New Year's Eve"]].forEach(f=>add(new Date(y,f[0]-1,f[1]),f[2],'o'));
 add(nthDow(y,4,0,2),"Mother's Day",'o');add(nthDow(y,5,0,3),"Father's Day",'o');
 add(off(-46),'Ash Wednesday','o');add(off(-7),'Palm Sunday','o');add(E,'Easter Sunday','o');add(off(39),'Ascension Day','o');add(off(49),'Pentecost','o');
 if(H['9-1'])add(H['9-1'],'Ramadan begins (approx.)','o');
 return HY[y]=L}
function hIdx(y){if(HX[y])return HX[y];const m={};holYear(y).forEach(h=>(m[h.d]=m[h.d]||[]).push(h));return HX[y]=m}
